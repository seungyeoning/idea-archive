<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSUBI — 두 사람을 잇는 실</title><link rel="stylesheet" href="style.css"><style>body{background:#f8f6f0}.public-demo{max-width:1160px;margin:0 auto;padding:64px 40px;display:grid;grid-template-columns:1fr 440px;gap:70px;align-items:center;min-height:100vh}.public-copy small{font-size:12px;letter-spacing:.16em;color:#9b736c}.public-copy h1{font-family:Georgia,serif;font-size:76px;letter-spacing:-4px;line-height:1.1;margin:18px 0 28px;color:#252532}.public-copy p{font-size:19px;line-height:1.85;color:#77716d}.public-scenes{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}.public-scenes button,.public-reset{border:1px solid #d9d1c6;background:transparent;color:#55515a;padding:10px 14px;border-radius:25px;font:inherit;font-size:12px;cursor:pointer}.public-scenes button.active{background:#252532;color:#fff;border-color:#252532}.public-copy .public-note{font-size:12px;color:#938b83;max-width:380px;line-height:1.8}.phone-space{padding:0;min-height:0}.phone-shell{margin:auto}.public-reset{margin-top:18px}.public-copy h2{font-family:inherit;font-size:27px;letter-spacing:-.8px;line-height:1.5;margin:0 0 18px;font-weight:500}@media(max-width:800px){.public-demo{grid-template-columns:1fr;padding:40px 20px 65px;gap:32px}.public-copy{text-align:center}.public-copy h1{font-size:54px;margin:14px 0 20px}.public-copy h2{font-size:24px}.public-copy p{font-size:15px}.public-scenes{justify-content:center;margin:22px 0}.public-copy .public-note{margin:0 auto}.public-reset{display:block;margin:15px auto}.phone-shell{max-width:100%}}</style><link rel="stylesheet" href="archive-return.css"></head><body><main class="public-demo"><section class="public-copy"><small>APP CONCEPT · 디자인 시안</small><h1>MUSUBI</h1><h2>말보다 먼저 전해지는 거리.</h2><p>멀어지면 느슨해지고,<br>가까워지면 팽팽해지는 우리의 실.</p><nav class="public-scenes" aria-label="무스비 시안 장면"><button data-scene="0" class="active">우리의 실</button><button data-scene="1">서로 연결</button><button data-scene="2">거리 체험</button><button data-scene="3">인연 모드</button><button data-scene="4">실 꾸미기</button></nav><p class="public-note">초대·거리·위치는 예시예요.<br>실제 GPS를 읽거나 알림·초대를 전송하지 않습니다.<br>스킨은 결제 없는 미리보기입니다.</p><button class="public-reset" id="reset-demo">시안 처음부터 ↻</button></section><section class="phone-space" aria-label="무스비 인터랙티브 시안"><div class="phone-shell"><div id="phone"></div></div></section></main><script src="demos.js"></script><script>Demos.setIdea('musubi');document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{Demos.showScene(Number(b.dataset.scene));document.querySelectorAll('[data-scene]').forEach(c=>c.classList.toggle('active',b===c))});document.querySelector('#reset-demo').onclick=()=>{Demos.reset();document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene==='0'))}</script><a class="archive-return" href="../../" aria-label="이 어플 어때? 아카이브로 돌아가기">← 아카이브</a></body></html>
