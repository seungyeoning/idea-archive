</style></head><body><header><span class="brand">눕런</span><a href="../?v=mode-check-5">영상·게시글 ↗</a></header><div class="controls"><div class="segmented"><button id="single" aria-pressed="true">한 장씩</button><button id="joined" aria-pressed="false">이어 보기</button></div><span class="counter" id="counter" aria-live="polite">1 / 2</span></div><div class="slides" id="slides" tabindex="0" aria-label="눕런 연결형 이미지 두 장, 좌우로 넘기기"><img src="01-tilted.png?v=mockup-3" width="1080" height="1920" alt="첫 번째 이미지. 실제 눕런 기록 화면이 들어간 3D 휴대폰을 비스듬히 크게 배치. 폰 옆면과 버튼이 보이고 두 번째 장으로 이어짐."><img src="02-tilted.png?v=mockup-3" width="1080" height="1920" alt="두 번째 이미지. 반대 방향으로 비스듬히 기울어진 3D 휴대폰 안에 실제 모드 선택 창. 연인에 체크만 된 상태."></div><div class="actions"><a class="primary" href="nooprun-3d-mockups.zip?v=mockup-3" download>두 장 함께 저장</a><a href="01-tilted.png?v=mockup-3" download>첫 번째 이미지</a><a href="02-tilted.png?v=mockup-3" download>두 번째 이미지</a></div><footer>1080 × 1920 PNG 두 장 · 01 → 02 순서로 첨부하면 이어져요.<br>실제 HTML 화면에 예시 기록·공개 테스트 지도를 사용한 게시 이미지입니다. SNS 게시 전 검토용입니다.<br>제작 스킬: <a href="https://github.com/imshaikot/app-preview-craft-skill" target="_blank" rel="noopener">app-preview-craft</a> · 3D 모델: <a href="https://sketchfab.com/3d-models/iphone-17-pro-4541aa8a28324b33a2baaf81d263aaec" target="_blank" rel="noopener">iPhone 17 Pro by Ranguel</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.<br>화면·각도·기기 색상을 변경했습니다. 이미지 하단 출처를 함께 유지해 주세요. <a href="CREDITS.txt" download>전체 출처</a></footer><script>
const s=document.querySelector('#slides'),one=document.querySelector('#single'),both=document.querySelector('#joined'),counter=document.querySelector('#counter');function mode(join){s.classList.toggle('joined',join);one.setAttribute('aria-pressed',String(!join));both.setAttribute('aria-pressed',String(join));s.scrollTo({left:0,behavior:'instant'});counter.textContent=join?'두 장 연결':'1 / 2'}one.onclick=()=>mode(false);both.onclick=()=>mode(true);s.addEventListener('scroll',()=>{if(!s.classList.contains('joined'))counter.textContent=(Math.round(s.scrollLeft/s.clientWidth)+1)+' / 2'},{passive:true});s.addEventListener('keydown',e=>{if(!s.classList.contains('joined')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();s.scrollBy({left:s.clientWidth*(e.key==='ArrowRight'?1:-1),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}});if(innerWidth>760)mode(true);
