<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>눕런 · 이어지는 두 장</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6ef;color:#111;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:auto}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}a{color:inherit}header a{text-decoration:none;font-size:13px}.controls{max-width:1200px;margin:0 auto;padding:0 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.segmented{display:flex;padding:4px;border-radius:99px;background:#e8e8e0}button{font:inherit;cursor:pointer;border:0;padding:8px 14px;border-radius:99px;background:transparent;font-size:13px;font-weight:600;min-height:40px}button[aria-pressed=true]{background:#111;color:#fff}.counter{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}.slides{display:flex;width:min(100%,540px);margin:0 auto;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}.slides img{display:block;width:100%;height:auto;flex:0 0 100%;scroll-snap-align:start;object-fit:contain;aspect-ratio:9/16}.slides.joined{width:min(100%,1200px);overflow-x:hidden;scroll-snap-type:none}.slides.joined img{width:50%;flex-basis:50%}.actions{width:min(100% - 44px,640px);margin:22px auto;display:flex;gap:10px;flex-wrap:wrap}.actions a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:1px solid #d0d0c9;border-radius:99px;text-decoration:none;font-size:13px;background:#fff;flex:1}.actions .primary{flex-basis:100%;background:#111;color:#fff;border-color:#111}footer{max-width:640px;margin:22px auto 40px;padding:0 22px;font-size:12px;color:#75756a}a:focus-visible,button:focus-visible{outline:3px solid #111;outline-offset:4px}@media(prefers-reduced-motion:no-preference){.slides{scroll-behavior:smooth}}
</style></head><body><header><span class="brand">눕런</span><a href="../?v=mode-check-5">영상·게시글 ↗</a></header><div class="controls"><div class="segmented"><button id="single" aria-pressed="true">한 장씩</button><button id="joined" aria-pressed="false">이어 보기</button></div><span class="counter" id="counter" aria-live="polite">1 / 2</span></div><div class="slides" id="slides" tabindex="0" aria-label="눕런 연결형 이미지 두 장, 좌우로 넘기기"><img src="01-rest.png?v=panorama-2" width="1080" height="1920" alt="첫 번째 이미지. 쉬는 것도 운동이다. 실제 눕기 기록 화면을 크게 확대해 오른쪽 다음 장까지 연결한 구성."><img src="02-together.png?v=panorama-2" width="1080" height="1920" alt="두 번째 이미지. 앞 장의 기록 화면이 왼쪽에 이어지고, 혼자 친구 연인 선택 팝업을 크게 배치. 연인이 체크돼 있으며 시작 전 상태."></div><div class="actions"><a class="primary" href="nooprun-connected-2.zip?v=panorama-2" download>두 장 함께 저장</a><a href="01-rest.png?v=panorama-2" download>첫 번째 이미지</a><a href="02-together.png?v=panorama-2" download>두 번째 이미지</a></div><footer>1080 × 1920 PNG 두 장 · 01 → 02 순서로 첨부하면 이어져요.<br>실제 HTML 화면에 예시 기록·공개 테스트 지도를 사용한 게시 이미지입니다. SNS 게시 전 검토용입니다.</footer><script>
const s=document.querySelector('#slides'),one=document.querySelector('#single'),both=document.querySelector('#joined'),counter=document.querySelector('#counter');function mode(join){s.classList.toggle('joined',join);one.setAttribute('aria-pressed',String(!join));both.setAttribute('aria-pressed',String(join));s.scrollTo({left:0,behavior:'instant'});counter.textContent=join?'두 장 연결':'1 / 2'}one.onclick=()=>mode(false);both.onclick=()=>mode(true);s.addEventListener('scroll',()=>{if(!s.classList.contains('joined'))counter.textContent=(Math.round(s.scrollLeft/s.clientWidth)+1)+' / 2'},{passive:true});s.addEventListener('keydown',e=>{if(!s.classList.contains('joined')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();s.scrollBy({left:s.clientWidth*(e.key==='ArrowRight'?1:-1),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}});if(innerWidth>760)mode(true);
</script></body></html>
